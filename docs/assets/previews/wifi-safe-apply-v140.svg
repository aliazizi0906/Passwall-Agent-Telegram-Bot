<text x="64" y="662" font-family="sans-serif" font-size="15" fill="#88bacf">Safety status: unconfirmed configuration is restored by the router, even without cPanel connectivity</text>
<text x="64" y="688" font-family="sans-serif" font-size="12" fill="#7698b0">Experimental feature. Real-world power-loss and hardware acceptance testing still required.</text>
