<text x="113" y="447" font-family="sans-serif" font-size="18" fill="#d7eafe" font-weight="bold">Local safety flow</text>
<g font-family="sans-serif" font-size="14"><rect x="112" y="470" width="227" height="60" rx="10" fill="#193c62"/><text x="131" y="506" fill="#edf8ff">1. Save UCI snapshot</text>
<rect x="365" y="470" width="227" height="60" rx="10" fill="#193c62"/><text x="385" y="506" fill="#edf8ff">2. Start local timer</text>
<rect x="618" y="470" width="227" height="60" rx="10" fill="#193c62"/><text x="638" y="506" fill="#edf8ff">3. Apply SSID change</text>
