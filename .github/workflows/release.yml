name: Release

on:
  push:
    branches:
      - "feature/v1.3-control-center"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.3.0-rc.2 or stable v1.3.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # Release from the feature branch ONLY for an explicitly labelled RC commit.
    if: github.ref != 'refs/heads/feature/v1.3-control-center' || contains(github.event.head_commit.message, '[publish-rc]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" = "refs/heads/feature/v1.3-control-center" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            RELEASE_TAG="v$(php -r 'require "server/setup_core.php"; echo pw_setup_version();')"
            [[ "$RELEASE_TAG" == v1.3.0-rc.* ]] || { echo "Only RC versions may publish from the feature branch" >&2; exit 1; }
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RELEASE_TAG="${{ inputs.version }}"
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              [ "$GITHUB_REF_NAME" = "feature/v1.3-control-center" ] && [[ "$RELEASE_TAG" == v1.3.0-rc.* ]] || {
                echo "Stable releases require main; only prerelease RC builds are allowed on feature/v1.3-control-center." >&2
                exit 1
              }
            fi
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'
          APP_VERSION="$(php -r 'require "server/lib.php"; echo app_version();')"
          [ "$RELEASE_TAG" = "v$APP_VERSION" ] || {
            echo "Release tag $RELEASE_TAG does not match app version v$APP_VERSION" >&2
            exit 1
          }
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Test
        run: |
          test -z "$(gofmt -l *.go)"
          go test ./...
          go vet ./...

      - name: PHP and Web UI syntax
        run: |
          find server -name '*.php' -print0 | xargs -0 -n1 php -l
          php server/tests/setup_core_test.php
          php server/tests/v130_command_validation_test.php
          python3 scripts/check_dashboard_js.py
          node --check openwrt/luci/www/luci-static/resources/view/pw-agent/control.js
          sh -n openwrt/install-remote.sh
          sh -n openwrt/install.sh
          sh -n openwrt/install-update.sh

      - name: Load and validate Ed25519 signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || {
            echo "Missing UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 repository secret" >&2
            exit 1
          }
          echo "$SIGNING_KEY" | base64 -d > /tmp/update-ed25519.pem
          chmod 600 /tmp/update-ed25519.pem
          openssl pkey -in /tmp/update-ed25519.pem -pubout -outform DER \
            | tail -c 32 | base64 -w0 > /tmp/update-public.b64
          PUBLISHED_KEY="$(tr -d '\r\n' < UPDATE_PUBLIC_KEY.b64)"
          [ "$(cat /tmp/update-public.b64)" = "$PUBLISHED_KEY" ] || {
            echo "Signing key does not match UPDATE_PUBLIC_KEY.b64" >&2
            exit 1
          }

      - name: Build and sign multi-architecture OpenWrt bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          build_bundle() {
            label="$1"
            goarch="$2"
            goarm="${3:-}"
            gomips="${4:-}"

            stage="/tmp/pw-agent-$label"
            rm -rf "$stage"
            mkdir -p "$stage"

            env_args=(GOOS=linux GOARCH="$goarch" CGO_ENABLED=0)
            [ -z "$goarm" ] || env_args+=(GOARM="$goarm")
            if [ -n "$gomips" ]; then
              case "$goarch" in
                mips64|mips64le) env_args+=(GOMIPS64="$gomips") ;;
                *) env_args+=(GOMIPS="$gomips") ;;
              esac
            fi

            env "${env_args[@]}" go build -trimpath -ldflags="-s -w -X main.releaseArchV14=$label" -o "$stage/pw-agent" .

            cp openwrt/install.sh "$stage/"
            cp openwrt/install-update.sh "$stage/"
            cp openwrt/pw-agent.init "$stage/"
            cp openwrt/config.example.json "$stage/"
            cp -a openwrt/luci "$stage/"
            chmod 755 \
              "$stage/pw-agent" \
              "$stage/install.sh" \
              "$stage/install-update.sh" \
              "$stage/pw-agent.init"

            asset_name="pw-agent-openwrt-$label.tar.gz"
            tar -C "$stage" -czf "dist/$asset_name" .
            (
              cd dist
              sha256sum "$asset_name" > "$asset_name.sha256"
            )
            openssl pkeyutl -sign -rawin \
              -inkey /tmp/update-ed25519.pem \
              -in "dist/$asset_name" \
              -out "dist/$asset_name.sig"
          }

          build_bundle armv5 arm 5
          build_bundle armv6 arm 6
          build_bundle armv7 arm 7
          build_bundle arm64 arm64
          build_bundle amd64 amd64
          build_bundle 386 386
          build_bundle mips mips "" softfloat
          build_bundle mipsle mipsle "" softfloat
          build_bundle mips64 mips64 "" softfloat
          build_bundle mips64le mips64le "" softfloat
          build_bundle riscv64 riscv64
          build_bundle loong64 loong64
          build_bundle ppc64le ppc64le

          bash scripts/package_cpanel.sh
          CPANEL_ZIP="dist/pw-agent-cpanel-${RELEASE_TAG}.zip"
          [ -s "$CPANEL_ZIP" ] || { echo "Missing cPanel ZIP" >&2; exit 1; }
          openssl pkeyutl -sign -rawin \
            -inkey /tmp/update-ed25519.pem \
            -in "$CPANEL_ZIP" \
            -out "$CPANEL_ZIP.sig"
          rm -f /tmp/update-ed25519.pem

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          release_args=()
          notes_args=(--generate-notes)
          if [[ "$RELEASE_TAG" == *-rc.* || "$RELEASE_TAG" == *-beta.* || "$RELEASE_TAG" == *-alpha.* ]]; then
            release_args+=(--prerelease)
            if [[ "$RELEASE_TAG" == v1.3.0-rc.* ]]; then
              notes_args=(--notes-file docs/en/RELEASE_NOTES_V1_3_RC.md)
            fi
          fi
          if [[ "$RELEASE_TAG" == v1.4.0 && ! -f docs/GA_V1_4_APPROVED.md ]]; then
            echo "Stable v1.4 requires reviewed hardware/security acceptance document" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            "${notes_args[@]}" \
            "${release_args[@]}" \
            --title "PW Agent $RELEASE_TAG"
