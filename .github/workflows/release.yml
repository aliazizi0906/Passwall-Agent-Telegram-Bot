name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Test
        run: go test ./...

      - name: Build ARMv7
        run: GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o pw-agent-armv7 .

      - name: Build OpenWrt bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="/tmp/pw-agent-release"
          mkdir -p "$STAGE"
          cp pw-agent-armv7 "$STAGE/"
          cp openwrt/install-update.sh "$STAGE/"
          cp openwrt/pw-agent.init "$STAGE/"
          cp -a openwrt/luci "$STAGE/"
          chmod 755 "$STAGE/pw-agent-armv7" "$STAGE/install-update.sh" "$STAGE/pw-agent.init"
          tar -C "$STAGE" -czf "pw-agent-openwrt-${VERSION}.tar.gz" .
          sha256sum "pw-agent-openwrt-${VERSION}.tar.gz" > "pw-agent-openwrt-${VERSION}.tar.gz.sha256"

      - name: Sign release with Ed25519
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          echo "$SIGNING_KEY" | base64 -d > /tmp/update-ed25519.pem
          VERSION="${GITHUB_REF_NAME#v}"
          openssl pkeyutl -sign -rawin -inkey /tmp/update-ed25519.pem             -in "pw-agent-openwrt-${VERSION}.tar.gz"             -out "pw-agent-openwrt-${VERSION}.tar.gz.sig"
          base64 -w0 "pw-agent-openwrt-${VERSION}.tar.gz.sig" > "pw-agent-openwrt-${VERSION}.tar.gz.sig.b64"
          rm -f /tmp/update-ed25519.pem

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME"             "pw-agent-openwrt-${VERSION}.tar.gz"             "pw-agent-openwrt-${VERSION}.tar.gz.sha256"             "pw-agent-openwrt-${VERSION}.tar.gz.sig"             "pw-agent-openwrt-${VERSION}.tar.gz.sig.b64"             --generate-notes
