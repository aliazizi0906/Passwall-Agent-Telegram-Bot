name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.7.0"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, pdo_mysql, sodium, zip
          coverage: none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging dependency
        run: python3 -m pip install 'cryptography==46.0.3'

      - name: Resolve and validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF_NAME" = "main" ] || {
              echo "Official manual releases must run from the main branch" >&2
              exit 1
            }
            RELEASE_TAG="${{ inputs.version }}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          echo "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$'
          APP_VERSION="$(php -r 'require "server/lib.php"; echo app_version();')"
          [ "$RELEASE_TAG" = "v$APP_VERSION" ] || {
            echo "Release tag $RELEASE_TAG does not match app version v$APP_VERSION" >&2
            exit 1
          }
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Test
        run: |
          test -z "$(gofmt -l *.go)"
          go test ./...
          go vet ./...
          find server -name '*.php' -print0 | xargs -0 -n1 php -l
          php server/tests/setup_core_test.php
          php server/tests/platform_v070_test.php
          php server/tests/web_update_test.php
          python3 -m unittest discover -s packaging -p 'test_*.py' -v
          python3 scripts/check_dashboard_js.py
          python3 scripts/check_markdown_links.py

      - name: Load and validate Ed25519 signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || {
            echo "Missing UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 repository secret" >&2
            exit 1
          }
          echo "$SIGNING_KEY" | base64 -d > /tmp/update-ed25519.pem
          chmod 600 /tmp/update-ed25519.pem
          openssl pkey -in /tmp/update-ed25519.pem -pubout -outform DER \
            | tail -c 32 | base64 -w0 > /tmp/update-public.b64
          openssl pkey -in /tmp/update-ed25519.pem -pubout -out /tmp/update-public.pem
          PUBLISHED_KEY="$(tr -d '\r\n' < UPDATE_PUBLIC_KEY.b64)"
          [ "$(cat /tmp/update-public.b64)" = "$PUBLISHED_KEY" ] || {
            echo "Signing key does not match UPDATE_PUBLIC_KEY.b64" >&2
            exit 1
          }

      - name: Build and sign multi-architecture OpenWrt bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          build_bundle() {
            label="$1"
            goarch="$2"
            goarm="${3:-}"
            gomips="${4:-}"

            stage="/tmp/pw-agent-$label"
            rm -rf "$stage"
            mkdir -p "$stage"

            env_args=(GOOS=linux GOARCH="$goarch" CGO_ENABLED=0)
            [ -z "$goarm" ] || env_args+=(GOARM="$goarm")
            [ -z "$gomips" ] || env_args+=(GOMIPS="$gomips")

            env "${env_args[@]}" go build -trimpath -ldflags="-s -w" -o "$stage/pw-agent" .

            cp openwrt/install.sh "$stage/"
            cp openwrt/install-update.sh "$stage/"
            cp openwrt/pw-agent.init "$stage/"
            cp openwrt/config.example.json "$stage/"
            cp -a openwrt/luci "$stage/"
            chmod 755 \
              "$stage/pw-agent" \
              "$stage/install.sh" \
              "$stage/install-update.sh" \
              "$stage/pw-agent.init"

            asset_name="pw-agent-openwrt-$label.tar.gz"
            tar -C "$stage" -czf "dist/$asset_name" .
            (
              cd dist
              sha256sum "$asset_name" > "$asset_name.sha256"
            )
            openssl pkeyutl -sign -rawin \
              -inkey /tmp/update-ed25519.pem \
              -in "dist/$asset_name" \
              -out "dist/$asset_name.sig"
          }

          build_bundle armv7 arm 7
          build_bundle arm64 arm64
          build_bundle amd64 amd64
          build_bundle 386 386
          build_bundle mips mips "" softfloat
          build_bundle mipsle mipsle "" softfloat

          # The PHP backend is a separately versioned, signed release asset so
          # the browser-only cPanel updater never trusts an unsigned ZIP or a
          # checksum downloaded independently from the payload.
          server_stage="/tmp/pw-agent-server-$RELEASE_VERSION"
          rm -rf "$server_stage"
          mkdir -p "$server_stage"
          rsync -a --delete \
            --exclude '/config.php' \
            --exclude '/tests/' \
            --exclude '/releases/*' \
            --exclude '/cache/*' \
            --exclude '/uploads/*' \
            server/ "$server_stage/"
          mkdir -p "$server_stage/releases"
          cp server/releases/.htaccess "$server_stage/releases/.htaccess"
          (
            cd "$server_stage"
            zip -X -qr "$GITHUB_WORKSPACE/dist/pw-agent-server-v$RELEASE_VERSION.zip" .
          )
          cp "dist/pw-agent-server-v$RELEASE_VERSION.zip" "dist/pw-agent-cpanel-v$RELEASE_VERSION.zip"
          (
            cd dist
            sha256sum "pw-agent-cpanel-v$RELEASE_VERSION.zip" > "pw-agent-cpanel-v$RELEASE_VERSION.zip.sha256"
          )
          openssl pkeyutl -sign -rawin \
            -inkey /tmp/update-ed25519.pem \
            -in "dist/pw-agent-cpanel-v$RELEASE_VERSION.zip" \
            -out "dist/pw-agent-cpanel-v$RELEASE_VERSION.zip.sig"

          SERVER_ARCHIVE="pw-agent-server-v$RELEASE_VERSION.zip"
          SERVER_SIZE="$(stat -c '%s' "dist/$SERVER_ARCHIVE")"
          SERVER_SHA256="$(sha256sum "dist/$SERVER_ARCHIVE" | awk '{print $1}')"
          SERVER_MANIFEST="dist/pw-agent-server-v$RELEASE_VERSION.manifest.json"
          jq -cn \
            --arg version "$RELEASE_VERSION" \
            --arg asset "$SERVER_ARCHIVE" \
            --arg sha256 "$SERVER_SHA256" \
            --argjson size "$SERVER_SIZE" \
            '{schema:1,version:$version,asset:$asset,size:$size,sha256:$sha256,php_min_version:"8.1.0",required_extensions:["curl","pdo_mysql","openssl","sodium","zip"],db_migrations:"additive"}' \
            > "$SERVER_MANIFEST"
          openssl pkeyutl -sign -rawin \
            -inkey /tmp/update-ed25519.pem \
            -in "$SERVER_MANIFEST" \
            -out "$SERVER_MANIFEST.sig"
          openssl pkeyutl -verify -rawin -pubin \
            -inkey /tmp/update-public.pem \
            -in "$SERVER_MANIFEST" \
            -sigfile "$SERVER_MANIFEST.sig"

          rm -f /tmp/update-ed25519.pem
          rm -f /tmp/update-public.pem

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "PW Agent $RELEASE_TAG"

      - name: Start signed OpenWrt package feeds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run package-feed.yml --ref main -f version="$RELEASE_TAG"
          gh workflow run apk-feed.yml --ref main -f version="$RELEASE_TAG"
