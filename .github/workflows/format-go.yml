name: Format Go sources (maintainer opt-in)

on:
  push:
    branches:
      - "feature/v1.4-secure-browser-control"

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-go]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply gofmt to Go source
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w *.go
          if ! git diff --quiet -- '*.go'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.go'
            git commit -m "style(go): format new Agent controls with gofmt"
            git push origin "HEAD:refs/heads/feature/v1.4-secure-browser-control"
          fi

