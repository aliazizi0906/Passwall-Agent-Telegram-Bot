name: Release v0.6.0 once

on:
  push:
    branches:
      - "feature/v0.6-fleet-platform"
    paths:
      - ".github/workflows/release-v060-once.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Validate main and version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(php -r 'require "server/lib.php"; echo app_version();')"
          [ "$APP_VERSION" = "0.6.0" ] || {
            echo "main app version is $APP_VERSION, expected 0.6.0" >&2
            exit 1
          }
          test -z "$(gofmt -l *.go)"
          go test ./...
          go vet ./...
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Load and validate Ed25519 signing key
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || {
            echo "Missing UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 repository secret" >&2
            exit 1
          }
          echo "$SIGNING_KEY" | base64 -d > /tmp/update-ed25519.pem
          chmod 600 /tmp/update-ed25519.pem
          openssl pkey -in /tmp/update-ed25519.pem -pubout -outform DER             | tail -c 32 | base64 -w0 > /tmp/update-public.b64
          PUBLISHED_KEY="$(tr -d '\r\n' < UPDATE_PUBLIC_KEY.b64)"
          [ "$(cat /tmp/update-public.b64)" = "$PUBLISHED_KEY" ] || {
            echo "Signing key does not match UPDATE_PUBLIC_KEY.b64" >&2
            exit 1
          }

      - name: Build and sign all OpenWrt bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          build_bundle() {
            label="$1"
            goarch="$2"
            goarm="${3:-}"
            gomips="${4:-}"

            stage="/tmp/pw-agent-$label"
            rm -rf "$stage"
            mkdir -p "$stage"

            env_args=(GOOS=linux GOARCH="$goarch" CGO_ENABLED=0)
            [ -z "$goarm" ] || env_args+=(GOARM="$goarm")
            [ -z "$gomips" ] || env_args+=(GOMIPS="$gomips")

            env "${env_args[@]}" go build -trimpath -ldflags="-s -w" -o "$stage/pw-agent" .

            cp openwrt/install.sh "$stage/"
            cp openwrt/install-update.sh "$stage/"
            cp openwrt/pw-agent.init "$stage/"
            cp openwrt/config.example.json "$stage/"
            cp -a openwrt/luci "$stage/"
            chmod 755               "$stage/pw-agent"               "$stage/install.sh"               "$stage/install-update.sh"               "$stage/pw-agent.init"

            asset_name="pw-agent-openwrt-$label.tar.gz"
            tar -C "$stage" -czf "dist/$asset_name" .
            (
              cd dist
              sha256sum "$asset_name" > "$asset_name.sha256"
            )
            openssl pkeyutl -sign -rawin               -inkey /tmp/update-ed25519.pem               -in "dist/$asset_name"               -out "dist/$asset_name.sig"
          }

          build_bundle armv7 arm 7
          build_bundle arm64 arm64
          build_bundle amd64 amd64
          build_bundle 386 386
          build_bundle mips mips "" softfloat
          build_bundle mipsle mipsle "" softfloat
          rm -f /tmp/update-ed25519.pem

      - name: Publish v0.6.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.6.0 >/dev/null 2>&1; then
            echo "Release v0.6.0 already exists" >&2
            exit 1
          fi
          gh release create v0.6.0 dist/*             --target "$TARGET_SHA"             --generate-notes             --title "PW Agent v0.6.0"
