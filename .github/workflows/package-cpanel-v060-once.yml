name: Package cPanel v0.6.0 once

on:
  push:
    branches:
      - "feature/v0.6-fleet-platform"
    paths:
      - ".github/workflows/package-cpanel-v060-once.yml"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate backend
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(php -r 'require "server/lib.php"; echo app_version();')"
          [ "$APP_VERSION" = "0.6.0" ]
          find server -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php server/tests/setup_core_test.php

      - name: Build cPanel package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (
            cd server
            zip -q -r ../dist/pw-agent-cpanel-v0.6.0.zip .
          )
          (
            cd dist
            sha256sum pw-agent-cpanel-v0.6.0.zip > pw-agent-cpanel-v0.6.0.zip.sha256
          )
          unzip -l dist/pw-agent-cpanel-v0.6.0.zip | grep -q 'setup.php'
          unzip -l dist/pw-agent-cpanel-v0.6.0.zip | grep -q '.htaccess'
          if unzip -l dist/pw-agent-cpanel-v0.6.0.zip | grep -qE '(^|/)config\.php$'; then
            echo "Runtime config.php must not be packaged" >&2
            exit 1
          fi

      - name: Upload to v0.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v0.6.0             dist/pw-agent-cpanel-v0.6.0.zip             dist/pw-agent-cpanel-v0.6.0.zip.sha256             --clobber
