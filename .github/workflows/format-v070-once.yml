name: Format v0.7 once

on:
  push:
    branches:
      - "feature/v0.7.0-platform-hardening"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feature/v0.7.0-platform-hardening"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format Go
        run: gofmt -w *.go
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.go'
          git commit -m "style: gofmt v0.7 sources"
          git push origin HEAD:feature/v0.7.0-platform-hardening
