name: One-shot Go formatting (development only)

on:
  push:
    branches: [feature/v1.3-control-center]
    paths:
      - features_v130.go
      - features_v130_test.go
      - features_v040.go
      - agent_main.go
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-go]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.3-control-center
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w features_v130.go features_v130_test.go features_v040.go agent_main.go
          git diff --check
          if ! git diff --quiet -- features_v130.go features_v130_test.go features_v040.go agent_main.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add features_v130.go features_v130_test.go features_v040.go agent_main.go
            git commit -m "style(agent): gofmt v1.3 read-only modules"
            git push origin HEAD:feature/v1.3-control-center
          fi
