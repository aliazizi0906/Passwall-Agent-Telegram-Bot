name: OpenWrt OPKG Feed

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing signed release tag, for example v0.7.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: opkg-feed-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="$INPUT_TAG"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || {
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline packaging tests
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v

      - name: Check packaging verifier shell syntax
        run: |
          sh -n packaging/verify-release-assets.sh
          sh -n packaging/verify-feed-archive.sh

      - name: Download official signed release bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pw-agent-release-assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'pw-agent-openwrt-*' \
            --dir "$RUNNER_TEMP/pw-agent-release-assets"

      - name: Verify source bundle checksums and Ed25519 signatures
        run: sh packaging/verify-release-assets.sh "$RUNNER_TEMP/pw-agent-release-assets" UPDATE_PUBLIC_KEY.b64

      - name: Set reproducible source timestamp
        id: source-time
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$RELEASE_TAG")"
          [[ "$SOURCE_DATE_EPOCH" =~ ^[0-9]+$ ]]
          echo "epoch=$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"

      - name: Build architecture-specific IPKs and feed metadata
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.source-time.outputs.epoch }}
        run: |
          set -euo pipefail
          python3 packaging/build_feed.py \
            --version "$RELEASE_VERSION" \
            --source-dir "$RUNNER_TEMP/pw-agent-release-assets" \
            --output-dir dist/feed \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Sign the feed with the existing release key
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PEM_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || {
            echo "Missing UPDATE_SIGNING_PRIVATE_KEY_PEM_B64; refusing to publish an unsigned feed." >&2
            exit 1
          }
          printf '%s' "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/update-ed25519.pem"
          chmod 600 "$RUNNER_TEMP/update-ed25519.pem"
          openssl pkey -in "$RUNNER_TEMP/update-ed25519.pem" -pubout -outform DER \
            | tail -c 32 | base64 -w0 > "$RUNNER_TEMP/private-public.b64"
          PUBLISHED_KEY="$(tr -d '\r\n' < UPDATE_PUBLIC_KEY.b64)"
          test "$(cat "$RUNNER_TEMP/private-public.b64")" = "$PUBLISHED_KEY" || {
            echo "Signing key does not match UPDATE_PUBLIC_KEY.b64" >&2
            exit 1
          }

          python3 packaging/sign_opkg_feed.py \
            --packages dist/feed/Packages \
            --private-key "$RUNNER_TEMP/update-ed25519.pem" \
            --public-key-b64 UPDATE_PUBLIC_KEY.b64 \
            --expected-public-key packaging/opkg-public-key \
            --output-signature dist/feed/Packages.sig \
            --output-public-key "$RUNNER_TEMP/opkg-public-key"

          KEY_ID="$(base64 -d UPDATE_PUBLIC_KEY.b64 | sha256sum | cut -c1-16)"
          cp "$RUNNER_TEMP/opkg-public-key" "dist/feed/pw-agent-opkg-key-$KEY_ID.pub"

      - name: Verify native opkg signature with upstream usign
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/openwrt/usign.git "$RUNNER_TEMP/usign-src"
          cmake -S "$RUNNER_TEMP/usign-src" -B "$RUNNER_TEMP/usign-build"
          cmake --build "$RUNNER_TEMP/usign-build" --parallel 2
          USIGN_BIN="$RUNNER_TEMP/usign-build/usign"
          KEY_ID="$(base64 -d UPDATE_PUBLIC_KEY.b64 | sha256sum | cut -c1-16)"
          mkdir -p "$RUNNER_TEMP/opkg-keys"
          cp packaging/opkg-public-key "$RUNNER_TEMP/opkg-keys/$KEY_ID"
          "$USIGN_BIN" -V -m dist/feed/Packages -P "$RUNNER_TEMP/opkg-keys" -x dist/feed/Packages.sig

      - name: Create signed offline feed archive
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_DATE_EPOCH: ${{ steps.source-time.outputs.epoch }}
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="dist/pw-agent-opkg-feed-$RELEASE_TAG.tar.gz"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            --use-compress-program='gzip -n' -cf "$ARCHIVE" -C dist/feed .
          (cd dist && sha256sum "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")
          openssl pkeyutl -sign -rawin \
            -inkey "$RUNNER_TEMP/update-ed25519.pem" \
            -in "$ARCHIVE" -out "$ARCHIVE.sig"
          sh packaging/verify-feed-archive.sh \
            "$ARCHIVE" "$ARCHIVE.sha256" "$ARCHIVE.sig" UPDATE_PUBLIC_KEY.b64
          rm -f "$RUNNER_TEMP/update-ed25519.pem"

      - name: Publish feed assets to the matching GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/feed/* \
            "dist/pw-agent-opkg-feed-$RELEASE_TAG.tar.gz" \
            "dist/pw-agent-opkg-feed-$RELEASE_TAG.tar.gz.sha256" \
            "dist/pw-agent-opkg-feed-$RELEASE_TAG.tar.gz.sig" \
            --repo "$GITHUB_REPOSITORY" --clobber
