name: Temporary v1.4 client policy Go formatter
on:
  push:
    branches: [feature/v1.4-secure-browser-control]
    paths:
      - features_v140_client_plan.go
      - features_v140_client_plan_test.go
permissions:
  contents: write
jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-client-v140]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.4-secure-browser-control
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format new Go files
        run: |
          gofmt -w features_v140_client_plan.go features_v140_client_plan_test.go
          git diff --check
          if ! git diff --quiet -- features_v140_client_plan.go features_v140_client_plan_test.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add features_v140_client_plan.go features_v140_client_plan_test.go
            git commit -m "style(clients): gofmt client policy previews"
            git push origin HEAD:feature/v1.4-secure-browser-control
          fi
